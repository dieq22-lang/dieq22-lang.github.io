<h1>Rez Bot</h1>
<p>Rez Bot is a personal, single-user tool. It watches my own restaurant-reservation alert emails
(from Resy and OpenTable) and notifies me on Telegram when a table I want opens up.</p>
<p>It is not offered to the public, has no other users, and runs only on my own computer.</p>
